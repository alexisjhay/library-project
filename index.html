<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Library Project</title>
		<link rel="stylesheet" href="css/style.css" />
		<script src="javascript/script.js" defer></script>
	</head>
	<body>
		<div class="container">
			<div class="header">
				<h1>Library</h1>
			</div>

			<div class="library-logs">
				<p class="unread-total">Unread: 0</p>
				<p class="read-total">Read: 0</p>
				<p class="total-books"></p>
			</div>

			<div class="user-actions">
				<button class="add-user">Add Book</button>
			</div>
			<div class="result">
				<!-- <div class="card">
					<h2 class="title">The Hobbit</h2>
					<h3 class="author">by: Alexis</h3>
					<p class="pages">23 pages</p>

					<div class="status-container">
						<span>Status: </span>
						<button class="status-btn read">Read</button>
						<button class="status-btn unread">Unread</button>
					</div>

					<div class="button-container">
						<button class="update-btn">Change Status</button>
						<button class="delete-btn">Delete</button>
					</div>
				</div> -->
			</div>
		</div>

		<div class="add-book-form hidden">
			<form class="book-form form-inactive">
				<div class="form-header">
					<h2>Add a Book</h2>
					<button class="close-form">X</button>
				</div>

				<label for="title">Title:</label>
				<input type="text" name="title" id="title" required maxlength="35" />

				<label for="author">Author:</label>
				<input type="text" name="author" id="author" maxlength="30" required />

				<label for="page">Page:</label>
				<input type="number" name="page" id="page" required />

				<div>
					<input type="checkbox" name="status" id="read-status" />
					<label for="read-status">Have you read this book ?</label>
				</div>

				<input type="submit" value="Add Book" />
			</form>
		</div>
	</body>
</html>
